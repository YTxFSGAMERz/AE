<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .lower-third {
      position: absolute;
      left: 100px;
      bottom: 120px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 18px 32px 18px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      transform-origin: left center;
    }
    .accent-bar {
      width: 6px;
      height: 54px;
      background: linear-gradient(180deg, #38bdf8 0%, #818cf8 100%);
      border-radius: 4px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }
    .text-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }
    .title {
      font-size: 17px;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
  >
    <div id="card" class="lower-third clip" data-start="0" data-duration="6" data-track-index="0">
      <div id="bar" class="accent-bar"></div>
      <div class="text-content">
        <div id="name" class="name">ALEX RIVERS</div>
        <div id="title" class="title">Lead Video Producer & Motion Designer</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Entrance at 0.5s
    tl.fromTo("#card",
      { x: -80, opacity: 0, scale: 0.95 },
      { x: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power4.out" },
      0.5
    );
    tl.fromTo("#bar",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.45, ease: "back.out(2)" },
      0.65
    );
    tl.fromTo(["#name", "#title"],
      { y: 15, opacity: 0 },
      { y: 0, opacity: 1, stagger: 0.1, duration: 0.4, ease: "power2.out" },
      0.7
    );

    // Exit at 5.2s
    tl.to("#card",
      { x: -60, opacity: 0, duration: 0.5, ease: "power3.in" },
      5.2
    );

    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
